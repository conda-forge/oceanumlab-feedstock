{% set name = "oceanumlab" %}
{% set version = "4.7.2" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://files.pythonhosted.org/packages/source/{{ name[0] }}/{{ name }}/oceanumlab-{{ version }}.tar.gz
  sha256: c31b72201d3119fa7da0985cf4eb7d42b488e3f46978765c41b64d8f510912c8

build:
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python >=3.10
    - hatchling >=1.5.0
    - jupyterlab >=4.0.0,<5
    - hatch-jupyter-builder
    - hatch-nodejs-version >=0.3.2
    - pip
  run:
    - python >=3.10
    - tornado
    - jupyterlab >=4.0.0,<5

test:
  imports:
    - oceanumlab
  commands:
    - pip check
  requires:
    - pip

about:
  home: https://oceanum.io
  summary: A Jupyterlab extension to interact with the Oceanum.io platform
  license: BSD-3-Clause
  license_file: LICENSE

extra:
  recipe-maintainers:
    - ondave
